[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[project]
name = "mini-cut"
version = "0.1.0"
description = "Local-first AI-assisted rough cutting for spoken videos"
readme = "README.md"
authors = [
    { name = "ben0724-ACE", email = "244254849@qq.com" },
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "opencc-python-reimplemented>=0.1.7,<0.2",
]

[tool.uv.build-backend]
module-name = "minicut"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
minversion = "9.1"
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]
xfail_strict = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.pyright]
include = ["src", "tests", "tools"]
exclude = [".venv", ".uv-cache", ".uv-python"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "strict"
