name: Platform compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install FFmpeg and CJK fonts on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: Install Python dependencies
        run: |
          python -m pip install uv
          uv sync --locked
      - name: Test platform behavior and actual media output
        run: >-
          uv run --no-sync python -m pytest -q
          tests/test_platform_support.py
          tests/test_ffmpeg_paths.py
          tests/test_render_filter_files.py
          tests/test_renderer.py
          tests/test_api_resume.py
          tests/test_api_import.py
          tests/test_api_asset_transcribe.py
          tests/test_api_output_edits.py
          tests/test_open_source_whisper.py
          tests/test_chunked_transcription.py
          tests/test_workflows.py
          tests/integration/test_platform_media_integration.py
          tests/integration/test_cleanup_render_integration.py
      - name: Test and build the frontend
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
